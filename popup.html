<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e; color: #eee;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px; color: white;
    }
    .title { font-size: 16px; font-weight: 600; }
    .info {
      padding: 12px; background: #16213e; border-radius: 8px;
      font-size: 12px; color: #aaa; line-height: 1.6;
    }
    .info strong { color: #fff; }

    .status {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px;
      background: #16213e; border-radius: 8px; font-size: 12px; margin-top: 12px; font-weight: 500;
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .dot-ok { background: #4caf50; }
    .dot-warn { background: #ff9800; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    
    .refresh-btn {
      background: transparent; border: 1px solid #333; color: #bbb;
      padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: #333; color: #fff; }
    
    .token-section {
      margin-top: 12px; padding: 12px; background: #16213e; border-radius: 8px;
    }
    .token-section label { display: block; font-size: 11px; color: #aaa; margin-bottom: 6px; }
    .token-input-group { display: flex; gap: 8px; }
    .token-input {
      flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #333;
      background: #0f172a; color: #fff; font-size: 12px; outline: none;
    }
    .token-input:focus { border-color: #667eea; }
    .save-btn {
      background: #667eea; color: #fff; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #5a6cd6; }
    #tokenMsg { font-size: 10px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">IY</div>
    <div class="title">Ibr YT Downloader</div>
  </div>
  <div class="info">
    YouTube, Instagram ve TikTok videolarının üzerindeki <strong>İndir</strong> butonuna tıklayarak doğrudan uygulamaya aktarabilirsiniz.
  </div>

  <div class="token-section">
    <label>Güvenlik Tokeniniz (Uygulamadan alınan)</label>
    <div class="token-input-group">
      <input type="text" id="extTokenInput" class="token-input" placeholder="Tokeni buraya yapıştırın">
      <button id="saveTokenBtn" class="save-btn">Kaydet</button>
    </div>
    <div id="tokenMsg">Token kaydedildi.</div>
  </div>

  <div class="status" id="statusSection">
    <div class="status-left">
      <div class="dot dot-warn" id="statusDot"></div>
      <div id="statusMsg">Bağlantı kontrol ediliyor...</div>
    </div>
    <button class="refresh-btn" id="refreshBtn">Yenile</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
